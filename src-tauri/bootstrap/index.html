<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriftGrid</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #e5e5e5;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
      padding: 24px;
    }
    .mark { font-size: 15px; font-weight: 500; letter-spacing: 0.18em; color: #fff; }
    .status { font-size: 12px; letter-spacing: 0.04em; color: #8a8a8a; min-height: 16px; }
    .dots { display: inline-flex; gap: 5px; }
    .dots i {
      width: 5px; height: 5px; border-radius: 50%; background: #4a4a4a;
      animation: pulse 1.1s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: 0.18s; }
    .dots i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .fallback { display: none; flex-direction: column; gap: 16px; align-items: center; }
    .fallback.show { display: flex; }
    .loader.hide { display: none; }
    .msg { font-size: 12px; color: #8a8a8a; line-height: 1.6; max-width: 320px; }
    .row { display: flex; gap: 10px; }
    button {
      font-family: inherit; font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
      color: #e5e5e5; background: #171717; border: 1px solid #2a2a2a; border-radius: 7px;
      padding: 9px 16px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    button:hover { background: #1f1f1f; border-color: #3a3a3a; }
    button.primary { background: #e5e5e5; color: #0a0a0a; border-color: #e5e5e5; }
    button.primary:hover { background: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">DRIFTGRID</div>

    <div class="loader" id="loader">
      <div class="status" id="status">Starting local server…</div>
      <div class="dots" style="margin-top:14px"><i></i><i></i><i></i></div>
    </div>

    <div class="fallback" id="fallback">
      <div class="status">Local DriftGrid isn't running</div>
      <div class="msg">Couldn't reach the local server. Make sure the DriftGrid launcher is running, or open the cloud version instead.</div>
      <div class="row">
        <button id="retry">Retry</button>
        <button class="primary" id="cloud">Open cloud</button>
      </div>
    </div>
  </div>

  <script>
    // Local-first boot: ask the always-on launcher (:3100) to start the dev
    // server, then load it. The launcher's /start blocks until the server is
    // healthy and returns the port. If the launcher is unreachable, degrade to
    // the cloud app (today's behavior) so the window is never dead.
    var LAUNCHER = 'http://127.0.0.1:3100';
    var PROD = 'https://driftgrid.ai';

    var loaderEl = document.getElementById('loader');
    var fallbackEl = document.getElementById('fallback');
    var statusEl = document.getElementById('status');

    function setStatus(t) { statusEl.textContent = t; }
    function showFallback() {
      loaderEl.classList.add('hide');
      fallbackEl.classList.add('show');
    }
    function showLoader() {
      fallbackEl.classList.remove('show');
      loaderEl.classList.remove('hide');
    }

    async function boot() {
      showLoader();
      setStatus('Starting local server…');
      try {
        // Fail fast if the launcher itself is down (connection refused is quick,
        // but guard anyway). The dev-server cold start can take a while, so once
        // we know the launcher answered we let /start run to completion.
        var res = await fetch(LAUNCHER + '/start', { method: 'POST' });
        if (!res.ok) throw new Error('launcher /start ' + res.status);
        var data = await res.json();
        var port = (data && data.port) || 3000;
        setStatus('Opening…');
        window.location.replace('http://127.0.0.1:' + port + '/');
      } catch (e) {
        showFallback();
      }
    }

    document.getElementById('retry').addEventListener('click', boot);
    document.getElementById('cloud').addEventListener('click', function () {
      window.location.replace(PROD);
    });

    boot();
  </script>
</body>
</html>
